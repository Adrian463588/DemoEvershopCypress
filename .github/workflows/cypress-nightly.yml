name: Nightly Full Regression — EverShop

on:
  schedule:
    - cron: '0 22 * * *'   # Setiap malam 22:00 UTC (05:00 WIB)
  workflow_dispatch:        # Tombol trigger manual dari GitHub UI

jobs:
  nightly-regression:
    name: Full Regression (Single Container)
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Ambil history laporan sebelumnya untuk grafik trend
      - name: Get Allure History from gh-pages
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Setup Java 17 (Allure requirement)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Clean Previous Results
        run: rm -rf allure-results allure-report cypress/reports || true

      - name: Run Full Cypress Suite
        uses: cypress-io/github-action@v6
        continue-on-error: true
        id: cypress
        with:
          browser: chrome
          install: false
        env:
          CYPRESS_BASE_URL: https://demo.evershop.io
          CYPRESS_USERNAME: ${{ secrets.CYPRESS_USERNAME }}
          CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}

      # Upload raw allure results sebagai backup & debugging
      - name: Upload Allure Results (Raw)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-allure-results-${{ github.run_number }}
          path: allure-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Mochawesome Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-mochawesome-${{ github.run_number }}
          path: cypress/reports/
          if-no-files-found: ignore
          retention-days: 7

      # ✅ FIX: Gunakan steps.cypress.outcome karena continue-on-error membuat step selalu "success"
      - name: Upload Screenshots (on failure)
        uses: actions/upload-artifact@v4
        if: always() && steps.cypress.outcome == 'failure'
        with:
          name: nightly-screenshots-${{ github.run_number }}
          path: cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-videos-${{ github.run_number }}
          path: cypress/videos/
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate Allure Report with History
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      - name: Upload Nightly Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-allure-report-${{ github.run_number }}
          path: allure-report/
          retention-days: 30

      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
