name: Nightly Full Regression

on:
  schedule:
    - cron: '0 22 * * *'   # Setiap malam 22:00 UTC (05:00 WIB)
  workflow_dispatch:        # Manual trigger

jobs:
  full-regression:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # diperlukan untuk push ke branch gh-pages

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Ambil history laporan sebelumnya untuk grafik trend
      - name: Get Allure History from gh-pages
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Setup Java 17 (Allure CLI requirement)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Cypress Tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
        env:
          CYPRESS_BASE_URL: https://demo.evershop.io

      # Generate report + simpan history (maks 20 run terakhir)
      - name: Generate Allure Report with History
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      # Simpan artifact sebagai backup
      - name: Upload Allure Report (Artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-allure-report
          path: allure-report/
          retention-days: 30

      # Deploy ke GitHub Pages
      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
