name: Cypress E2E Tests — EverShop

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CYPRESS_BASE_URL: https://demo.evershop.io

jobs:
  # ── Job 1: Run Tests ────────────────────────────────────
  cypress-run:
    name: Run Cypress Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Clean Previous Allure Results
        run: rm -rf allure-results allure-report || true

      - name: Run Cypress Tests
        uses: cypress-io/github-action@v6
        continue-on-error: true
        with:
          browser: chrome
          install: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CYPRESS_BASE_URL: ${{ env.CYPRESS_BASE_URL }}
          CYPRESS_USERNAME: ${{ secrets.CYPRESS_USERNAME }}
          CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Screenshots (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos/
          if-no-files-found: ignore
          retention-days: 7


  # ── Job 2: Generate & Publish Allure Report ─────────────
  allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-24.04
    needs: cypress-run
    if: always()
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ✅ FIX: ambil semua branch termasuk gh-pages

      # ✅ FIX: Inisialisasi gh-pages jika belum ada (first run)
      - name: Initialize gh-pages branch (first run only)
        run: |
          if ! git ls-remote --heads origin gh-pages | grep -q "gh-pages"; then
            echo "Branch gh-pages belum ada. Membuat branch baru..."
            git checkout --orphan gh-pages
            git reset --hard
            touch .nojekyll
            git add .nojekyll
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git commit -m "Initialize gh-pages branch"
            git push origin gh-pages
            git checkout -
            echo "Branch gh-pages berhasil dibuat."
          else
            echo "Branch gh-pages sudah ada. Melewati inisialisasi."
          fi

      - name: Get Allure History from gh-pages
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      # ✅ FIX: Debug — pastikan allure-results tidak kosong
      - name: Verify Allure Results exist
        run: |
          echo "=== Isi allure-results/ ==="
          ls -la allure-results/ || echo "KOSONG atau tidak ada!"
          echo "Total files: $(find allure-results -type f | wc -l)"

      - name: Generate Allure Report with History
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      # ✅ FIX: Debug — pastikan allure-history ter-generate
      - name: Verify Allure History generated
        run: |
          echo "=== Isi allure-history/ ==="
          ls -la allure-history/ || echo "KOSONG atau tidak ada!"
          echo "Total files: $(find allure-history -type f | wc -l)"

      - name: Upload Allure HTML Report (Artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-html-report
          path: allure-report/
          retention-days: 30

      - name: Deploy Allure Report to GitHub Pages
        if: always() && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: false
